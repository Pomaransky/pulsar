<app-settings class="absolute top-4 right-4" />
<div class="flex justify-center items-center h-screen">
  <p-card class="p-6 pb-0 w-full max-w-[400px]">
    <ng-template #header>
      <div class="flex flex-col items-center justify-center">
        <img src="/logo_big.svg" alt="Pulsar" class="w-40" />
      </div>
    </ng-template>
    <ng-template #content>
      <form (submit)="onRegister($event)" class="flex flex-col gap-4">
        <app-input-field-signal-forms [formField]="registerForm.username" label="register.username" />
        <app-input-field-signal-forms [formField]="registerForm.email" label="register.email" />
        <app-input-field-signal-forms [formField]="registerForm.password" type="password" label="register.password" />
        <app-input-field-signal-forms [formField]="registerForm.confirmPassword" type="password"
          label="register.confirmPassword" />

        <button pButton type="submit" size="large" class="w-full"
          [disabled]="registerForm().invalid() || registerForm().submitting()">
          @if (registerForm().submitting()) {
          <i class="pi pi-spin pi-spinner" pButtonIcon></i>
          } @else {
          <i class="pi pi-user-plus" pButtonIcon></i>
          }
          <span pButtonLabel>{{ 'register.register' | translate }}</span>
        </button>
        @for (error of registerForm().errors(); track error.kind) {
        <div>
          <p-message severity="error" class="max-w-full">{{ error.message | translate }}</p-message>
        </div>
        }
      </form>
    </ng-template>
    <ng-template #footer>
      <div class="text-sm mt-1 flex flex-col justify-center items-center gap-4">
        <div>
          <span class="mr-2 inline">{{ "register.haveAccount" | translate }}</span>
          <button pButton link (click)="onLogin()" class="linkBtn">
            <i pButtonIcon class="pi pi-sign-in"></i>
            <span pButtonLabel>{{ 'register.login' | translate }}</span>
          </button>
        </div>
        <button pButton link (click)="openPrivacyPolicy()" class="linkBtn">
          <i pButtonIcon class="pi pi-shield"></i>
          <span pButtonLabel>{{ 'login.privacyPolicy' | translate }}</span>
        </button>
      </div>
    </ng-template>
  </p-card>
</div>
