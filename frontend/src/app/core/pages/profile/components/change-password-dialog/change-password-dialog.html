@if(visible()){
<app-dialog [visible]="visible()" (visibilityChange)="changeVisibility($event)"
  [title]="'changePassword.title' | translate" icon="pi pi-lock" styleClass="w-full sm:w-[500px]">
  <form (submit)="onChangePassword($event)" class="w-full flex flex-col gap-5">
    <app-input-field-signal-forms type="password" [formField]="changePasswordForm.currentPassword"
      label="changePassword.currentPassword" />
    <app-input-field-signal-forms type="password" [formField]="changePasswordForm.password"
      label="changePassword.newPassword" />
    <app-input-field-signal-forms type="password" [formField]="changePasswordForm.passwordConfirmation"
      label="changePassword.confirmPassword" />

    <div dialogFooter class="w-full flex items-center justify-end gap-2">
      <button pButton size="large" type="button" [outlined]="true" (click)="changeVisibility(false)" class="w-32"><span
          pButtonLabel>{{ 'common.cancel' | translate }}</span></button>
      <button pButton type="submit" size="large" class="w-32"
        [disabled]="changePasswordForm().invalid() || changePasswordForm().submitting()">
        <span pButtonLabel>{{ 'common.save' | translate }}</span>
      </button>
    </div>

    @for (error of changePasswordForm().errors(); track error.kind) {
    <p-message severity="error" class="max-w-full">{{ error.message | translate }}</p-message>
    }
  </form>
</app-dialog>
}
