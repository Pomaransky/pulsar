<app-dialog [visible]="visible()" (visibilityChange)="visible.set($event)" [title]="'editProfile.title' | translate"
  icon="pi pi-user-edit" styleClass="w-full sm:w-[500px]">
  <form (submit)="onEdit($event)" class="flex flex-col gap-5">
    <app-input-field-signal-forms [formField]="editForm.firstName" label="editProfile.firstName" />
    <app-input-field-signal-forms [formField]="editForm.lastName" label="editProfile.lastName" />
    <p-datepicker type="datepicker" [dateFormat]="'dd/mm/yy'" [formField]="editForm.birthDate"
      label="editProfile.birthDate" [appendTo]="'body'" />
    <app-input-field-signal-forms type="textarea" [rows]="4" [formField]="editForm.aboutMe"
      label="editProfile.aboutMe"/>

<div dialogFooter class="w-full flex items-center justify-end gap-2">
  <button pButton size="large" type="button" [outlined]="true" (click)="changeVisibility(false)" class="w-32"><span
      pButtonLabel>{{ 'common.cancel' | translate }}</span></button>
  <button pButton type="submit" size="large" class="w-32"
    [disabled]="editForm().invalid() || editForm().submitting()">
    <span pButtonLabel>{{ 'common.save' | translate }}</span>
  </button>
</div>
</form>
</app-dialog>
