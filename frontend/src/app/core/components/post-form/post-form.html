<form class="w-full flex flex-col gap-2" (submit)="onSubmit($event)">
  <div
    class="post-composer rounded-lg border border-violet-200 dark:border-slate-700 overflow-hidden bg-surface-0 dark:bg-slate-950">
    <div class="post-composer__input relative">
      <app-input-field-signal-forms [formField]="postForm.content" type="textarea" [rows]="rows" [label]="label" />
      @if (selectedMedia(); as file) {
      <div class="relative bg-surface-0 dark:bg-slate-950">
        <img [src]="previewUrl()" [alt]="file.name" class="w-full h-auto object-cover object-top" />
        <button pButton type="button" severity="danger"
          class="p-button-rounded p-button-sm absolute top-1 right-1 shadow" (click)="clearMedia()">
          <i class="pi pi pi-times" pButtonIcon></i></button>
      </div>
      }
    </div>
    <p-fileupload #mediaUpload name="postMedia[]" [accept]="acceptFileTypes.join(', ')" [customUpload]="true"
      (onSelect)="onMediaSelect($event)">
      <ng-template #header let-chooseCallback="chooseCallback">
        @if (!selectedMedia(); as file) {
        <button pButton type="button" variant="text" [pTooltip]="'post.attachMultimedia' | translate"
          tooltipPosition="bottom" tooltipStyleClass="text-xs" (click)="chooseCallback()">
          <i class="pi pi pi-image" pButtonIcon></i>
        </button>
        }
      </ng-template>
      <ng-template #content let-file let-uploadCallback="uploadCallback"></ng-template>
    </p-fileupload>
  </div>
  <button pButton type="submit" size="large" class="w-full"
    [disabled]="postForm().invalid() || postForm().submitting()">
    @if (postForm().submitting()) {
    <i class="pi pi-spin pi-spinner" pButtonIcon></i>
    } @else {
    <i class="pi pi-send" pButtonIcon></i>
    }
    <span pButtonLabel>{{ submitLabel | translate }}</span>
  </button>
</form>
