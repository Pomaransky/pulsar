<p-floatlabel [variant]="floatLabelVariant()">
  <p-iconfield>
    @if (type() === 'password') {
    <input pInputPassword [(mask)]="passwordMask" [value]="value()" [disabled]="disabled()"
      [class.p-invalid]="showError()" class="w-full" (input)="onInput($event)" (blur)="touched.set(true)" [id]="id()" [attr.placeholder]="placeholder()" />
    <p-inputicon [class]="passwordMask ? 'pi pi-eye' : 'pi pi-eye-slash'" class="cursor-pointer"
      (click)="togglePasswordMask()" />

    } @else if(type() === 'textarea') {
    <textarea pTextarea [rows]="rows()" [value]="value()" [disabled]="disabled()" [class.p-invalid]="showError()"
      class="w-full resize-none" (input)="onInput($event)" (blur)="touched.set(true)" [id]="id()" [attr.placeholder]="placeholder()"></textarea>
    } @else {
    @if(icon()) {
    <p-inputicon [class]="`cursor-pointer pi pi-${icon()}`" (click)="togglePasswordMask()" />
    }
    <input pInputText [type]="type()" [value]="value()" [disabled]="disabled()" [class.p-invalid]="showError()"
      class="w-full" (input)="onInput($event)" (blur)="touched.set(true)" [id]="id()" [attr.placeholder]="placeholder()"/>
    }
  </p-iconfield>
  @if (label()) {
  <label [for]="id()">{{ label() | translate }}</label>
  }
</p-floatlabel>

<!-- Errors -->
@if (showError() && firstError(); as error) {
<small class="p-error block pl-2 mt-1">
  <span class="text-red-500">
    {{ error.message | translate }}
  </span>
</small>
}
