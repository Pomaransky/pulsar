<p-floatlabel variant="in">
  @if (type() === 'password') {
  <p-iconfield>
    <input pInputPassword [(mask)]="passwordMask" [value]="value()" [disabled]="disabled()"
      [class.p-invalid]="showError" class="w-full" (input)="onInput($event)" (blur)="touched.set(true)" [id]="id()" />
    <p-inputicon [class]="passwordMask ? 'pi pi-eye' : 'pi pi-eye-slash'" class="cursor-pointer"
      (click)="togglePasswordMask()" />
  </p-iconfield>
  } @if(type() === 'textarea') {
  <textarea pTextarea [rows]="rows()" [value]="value()" [disabled]="disabled()"
    [class.p-invalid]="showError" class="w-full resize-none" (input)="onInput($event)" (blur)="touched.set(true)"
    [id]="id()"></textarea>
  } @else {
  <input pInputText [type]="type()" [value]="value()" [disabled]="disabled()" [class.p-invalid]="showError"
    class="w-full" (input)="onInput($event)" (blur)="touched.set(true)" [id]="id()" />
  }

  @if (label()) {
  <label [for]="id()">{{ label() | translate }}</label>
  }
</p-floatlabel>

<!-- Errors -->
@if (showError && firstError; as error) {
<small class="p-error block pl-2 mt-1">
  <span class="text-red-500">
    {{ error.message | translate }}
  </span>
</small>
}
